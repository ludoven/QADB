name: Desktop Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build DMG
        run: ./gradlew :composeApp:packageReleaseDmg

      - name: Rename macOS DMG with architecture
        run: |
          dmg_dir="composeApp/build/compose/binaries/main-release/dmg"
          dmg_file="$(ls "$dmg_dir"/*.dmg | head -n 1)"
          base_name="$(basename "$dmg_file" .dmg)"
          target_file="$dmg_dir/${base_name}-macos-${{ matrix.arch }}.dmg"
          rm -f "$target_file"
          mv "$dmg_file" "$target_file"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: qadb-macos-dmg-${{ matrix.arch }}
          path: composeApp/build/compose/binaries/main-release/dmg/*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build MSI, EXE and distributable app image
        run: .\gradlew.bat :composeApp:packageReleaseMsi :composeApp:packageReleaseExe :composeApp:createReleaseDistributable

      - name: Build ZIP portable package
        shell: pwsh
        run: |
          $versionMatch = Select-String -Path "composeApp/build.gradle.kts" -Pattern 'val appVersion = "([^"]+)"'
          if (-not $versionMatch) { throw "Unable to read appVersion from composeApp/build.gradle.kts" }
          $appVersion = $versionMatch.Matches[0].Groups[1].Value
          $appRoot = "composeApp/build/compose/binaries/main-release/app"
          $appDir = Get-ChildItem $appRoot -Directory | Select-Object -First 1
          if (-not $appDir) { throw "No app image directory found under $appRoot" }
          New-Item -ItemType Directory -Path "composeApp/build/compose/binaries/main-release/zip" -Force | Out-Null
          $zipPath = "composeApp/build/compose/binaries/main-release/zip/QADB-$appVersion-windows-portable.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$($appDir.FullName)/*" -DestinationPath $zipPath

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qadb-windows-installers
          path: |
            composeApp/build/compose/binaries/main-release/msi/*.msi
            composeApp/build/compose/binaries/main-release/exe/*.exe
            composeApp/build/compose/binaries/main-release/zip/*.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm zstd libarchive-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build DEB, RPM and distributable app image
        run: ./gradlew :composeApp:packageReleaseDeb :composeApp:packageReleaseRpm :composeApp:packageReleaseAppImage

      - name: Rename Linux packages with architecture
        run: |
          set -euo pipefail
          for ext in deb rpm; do
            package_dir="composeApp/build/compose/binaries/main-release/$ext"
            package_file="$(ls "$package_dir"/*."$ext" | head -n 1)"
            base_name="$(basename "$package_file" ."$ext")"
            target_file="$package_dir/${base_name}-linux-x64.$ext"
            rm -f "$target_file"
            mv "$package_file" "$target_file"
          done

      - name: Build Linux portable tarball
        run: |
          set -euo pipefail
          app_version="$(sed -n 's/.*val appVersion = "\([^"]*\)".*/\1/p' composeApp/build.gradle.kts | head -n 1)"
          if [ -z "$app_version" ]; then
            echo "Unable to read appVersion from composeApp/build.gradle.kts" >&2
            exit 1
          fi
          app_root="composeApp/build/compose/binaries/main-release/app"
          app_dir="$(find "$app_root" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$app_dir" ]; then
            echo "No app image directory found under $app_root" >&2
            exit 1
          fi
          tar_dir="composeApp/build/compose/binaries/main-release/tar"
          mkdir -p "$tar_dir"
          tar_path="$tar_dir/QADB-$app_version-linux-x64.tar.gz"
          rm -f "$tar_path"
          tar -czf "$tar_path" -C "$app_dir" .

      - name: Build Arch Linux package (.pkg.tar.zst)
        run: |
          set -euo pipefail
          app_version="$(sed -n 's/.*val appVersion = "\([^"]*\)".*/\1/p' composeApp/build.gradle.kts | head -n 1)"
          if [ -z "$app_version" ]; then
            echo "Unable to read appVersion from composeApp/build.gradle.kts" >&2
            exit 1
          fi
          app_root="composeApp/build/compose/binaries/main-release/app"
          app_dir="$(find "$app_root" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$app_dir" ]; then
            echo "No app image directory found under $app_root" >&2
            exit 1
          fi
          launcher="$(find "$app_dir/bin" -mindepth 1 -maxdepth 1 -type f | head -n 1)"
          if [ -z "$launcher" ]; then
            echo "No launcher found in $app_dir/bin" >&2
            exit 1
          fi
          launcher_name="$(basename "$launcher")"

          pkgname="qadb"
          pkgrel="1"
          pkgarch="x86_64"
          pkgver="$app_version-$pkgrel"

          arch_dir="composeApp/build/compose/binaries/main-release/arch"
          staging="$arch_dir/staging"
          rm -rf "$staging"
          mkdir -p "$staging/opt/QADB" "$staging/usr/bin" "$staging/usr/share/applications" "$staging/usr/share/pixmaps"
          cp -a "$app_dir/." "$staging/opt/QADB/"

          # 桌面入口、图标与 /usr/bin 快捷方式
          ln -s "/opt/QADB/bin/$launcher_name" "$staging/usr/bin/qadb"
          cp "composeApp/src/desktopMain/composeResources/drawable/ic_logo.png" "$staging/usr/share/pixmaps/qadb.png"
          cat > "$staging/usr/share/applications/qadb.desktop" <<'EOF'
          [Desktop Entry]
          Name=QADB
          Comment=An open-source, cross-platform, modern ADB desktop debugging tool
          Exec=/usr/bin/qadb
          Icon=qadb
          Terminal=false
          Type=Application
          Categories=Development;Utility;
          EOF

          # 包元数据 .PKGINFO
          pkg_size="$(du -sb "$staging" | awk '{print $1}')"
          cat > "$staging/.PKGINFO" <<EOF
          # Generated by QADB release workflow
          pkgname = $pkgname
          pkgbase = $pkgname
          pkgver = $pkgver
          pkgdesc = An open-source, cross-platform, modern ADB desktop debugging tool
          url = https://ludoven.github.io/QADB/
          builddate = $(date -u +%s)
          packager = QADB Release <ludoven>
          size = $pkg_size
          arch = $pkgarch
          license = MIT
          EOF

          # 文件校验清单 .MTREE（gzip 压缩，与 makepkg 一致）
          ( cd "$staging" && bsdtar -czf .MTREE --format=mtree --options='!all,use-set,type,uid,gid,mode,time,size,md5,sha256,link' . )

          # 打成 .pkg.tar.zst
          pkg_path="$arch_dir/$pkgname-$app_version-$pkgrel-$pkgarch.pkg.tar.zst"
          rm -f "$pkg_path"
          ( cd "$staging" && bsdtar --zstd -cf "$pkg_path" . )
          ls -lh "$pkg_path"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qadb-linux-packages-x64
          path: |
            composeApp/build/compose/binaries/main-release/deb/*-linux-x64.deb
            composeApp/build/compose/binaries/main-release/rpm/*-linux-x64.rpm
            composeApp/build/compose/binaries/main-release/tar/*.tar.gz
            composeApp/build/compose/binaries/main-release/arch/*.pkg.tar.zst
          if-no-files-found: error

  publish-release:
    needs:
      - build-macos
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qadb-macos-dmg-*
          path: release-assets/macos
          merge-multiple: true

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: qadb-windows-installers
          path: release-assets/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: qadb-linux-packages-x64
          path: release-assets/linux

      - name: List release assets
        run: find release-assets -type f -print

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/macos/*.dmg
            release-assets/windows/msi/*.msi
            release-assets/windows/exe/*.exe
            release-assets/windows/zip/*.zip
            release-assets/linux/deb/*.deb
            release-assets/linux/rpm/*.rpm
            release-assets/linux/tar/*.tar.gz
            release-assets/linux/arch/*.pkg.tar.zst
